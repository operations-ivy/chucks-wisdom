apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reader-ingress
  namespace: chuck
spec:
  ingressClassName: traefik
  rules:
  # Served through brick9000's proxy (brick-cicd-config).
  - host: reader.brick.nozdormu.cloud
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: reader-service
            port:
              number: 80
