apiVersion: apps/v1
kind: Deployment
metadata:
  name: reader
  namespace: chuck
spec:
  # Two pods on different nodes, so the app keeps answering while one moves,
  # restarts or rolls out (its PodDisruptionBudget keeps one up during drains).
  replicas: 2
  selector:
    matchLabels:
      app: reader
  template:
    metadata:
      labels:
        app: reader
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        # Soft: with only one schedulable node left, both still run.
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: reader
      containers:
      - name: reader
        image: whitepatrick/joke-reader:1.0.13
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5000
        env:
        # From the chuck-db SealedSecret (brick-k8s-secrets/chucks-wisdom/).
        - name: DB_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: chuck-db
              key: DB_CONNECTION_STRING
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
