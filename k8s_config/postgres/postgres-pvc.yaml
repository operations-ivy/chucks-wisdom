---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: chuck
  annotations:
    # The database's data: Argo CD never prunes or deletes it, even if this
    # file or the Application goes away (brick-k8s-config#42).
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
