---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: chuck
spec:
  # One Postgres at a time on its data directory: a rolling update would
  # start the new pod beside the old one on the same volume.
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        chuck.io/storage-node: "true"
      containers:
        - name: postgres
          image: postgres:15
          # From the chuck-db SealedSecret (brick-k8s-secrets/chucks-wisdom/).
          # Postgres only reads these when it creates the database; the
          # password was changed on the running database with ALTER ROLE.
          envFrom:
            - secretRef:
                name: chuck-db
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-storage
            - mountPath: /docker-entrypoint-initdb.d
              name: init-scripts
              readOnly: true
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-scripts
          configMap:
            name: postgres-init-scripts
