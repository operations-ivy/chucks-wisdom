---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: chuck
spec:
  # One Postgres at a time on its data directory: a rolling update would
  # start the new pod beside the old one on the same volume.
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        chuck.io/storage-node: "true"
      containers:
        - name: postgres
          image: postgres:15
          # From the chuck-db SealedSecret (brick-k8s-secrets/chucks-wisdom/).
          # Postgres only reads these when it creates the database; the
          # password was changed on the running database with ALTER ROLE.
          envFrom:
            - secretRef:
                name: chuck-db
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-storage
            - mountPath: /docker-entrypoint-initdb.d
              name: init-scripts
              readOnly: true
        # Postgres' own metrics for Prometheus (podmonitor.yaml in
        # k8s_config/metrics/): connections, transactions, table and database
        # sizes, locks. Same credentials as the app, over localhost.
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
          # postmaster: when Postgres started (off by default).
          args: ["--collector.postmaster"]
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: chuck-db
                  key: POSTGRES_USER
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: chuck-db
                  key: POSTGRES_DB
            - name: DATA_SOURCE_USER
              value: "$(DB_USER)"
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: chuck-db
                  key: POSTGRES_PASSWORD
            - name: DATA_SOURCE_URI
              value: "localhost:5432/$(DB_NAME)?sslmode=disable"
          ports:
            - name: metrics
              containerPort: 9187
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-scripts
          configMap:
            name: postgres-init-scripts
