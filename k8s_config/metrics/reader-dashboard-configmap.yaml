# Grafana dashboard for the reader's /metrics (metrics.py) and Postgres'
# exporter sidecar (podmonitor.yaml). Grafana's sidecar loads any ConfigMap
# labelled grafana_dashboard, in any namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: chuck-reader-dashboard
  namespace: chuck
  labels:
    grafana_dashboard: "1"
data:
