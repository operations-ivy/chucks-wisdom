apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Argo CD renders this directory with Kustomize (the Application sets it to
# kustomize; brick-k8s-config argocd/apps/chucks-wisdom.yaml). Every manifest
# Argo should manage must be listed here, or its sync would prune anything it
# no longer sees - including the Postgres PVC.
#
# The importer is a suspended CronJob: Argo manages it but it never fires on a
# schedule. Jenkins' chuck-importer job starts an on-demand Job from it
# (kubectl create job --from=cronjob/importer), like wigle-sync-now, and that
# Job inherits the image tag stamped here. Both images are set once in images:
# below; a release bumps the matching newTag (plus the version in
# pyproject.toml) and builds it with Jenkins' build-image job first.

resources:
  - chuck-namespace.yaml
  - postgres/postgres-configmap.yaml
  - postgres/postgres-pvc.yaml
  - postgres/postgres-deployment.yaml
  - postgres/postgres-service.yaml
  - importer/importer-cronjob.yaml
  - reader/reader-deployment.yaml
  - reader/reader-service.yaml
  - reader/reader-ingress.yaml
  - reader/reader-pdb.yaml
  - metrics/podmonitor.yaml
  - metrics/metrics-service.yaml
  - metrics/metrics-service-monitor.yaml
  - metrics/chuck-app-health-dashboard-configmap.yaml
  - metrics/importer-metrics-dashboard-configmap.yaml
  - metrics/reader-dashboard-configmap.yaml

images:
  - name: whitepatrick/joke-importer
    newTag: 1.1.3
  - name: whitepatrick/joke-reader
    newTag: 1.0.13
