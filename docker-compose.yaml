version: '3.8'

services:
  joke-reader:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: joke-reader:1.0
    environment:
      - POETRY_NO_INTERACTION=1
      - DB_CONNECTION_STRING=
      - OTEL_EXPORTER_OTLP_ENDPOINT=
    working_dir: /code
    volumes:
      - code-volume:/code
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      retries: 5
      start_period: 30s
      timeout: 30s

  joke-importer:
    build:
      context: .
      dockerfile: Dockerfile.db
    image: joke-importer:1.0
    environment:
      - POETRY_NO_INTERACTION=1
      - DB_CONNECTION_STRING=
      - OTEL_EXPORTER_OTLP_ENDPOINT=
    working_dir: /code
    volumes:
      - code-volume:/code

volumes:
     code-volume:
