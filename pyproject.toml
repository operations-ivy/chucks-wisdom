[tool.poetry]
name = "chucks_wisdom"
version = "1.0.0"
description = "Silly project to work with an API, SQL, Kafka, and maybe Open Telemetry"
authors = ["Patrick White <whitep@alumni.vcu.edu>"]

[tool.poetry.dependencies]
python = "^3.11"
pre-commit = "^4.2.0"
requests = "^2.32.3"
flask = "^3.1.0"
structlog = "^25.2.0"
psycopg = {extras = ["binary", "pool"], version = "^3.2.7"}
sql-storage-operations-ivy = "^1.0.0"
api-request-operations-ivy = "^0.1.0"
prometheus-client = "^0.22.0"
opentelemetry-api = "^1.44.0"
opentelemetry-sdk = "^1.44.0"
opentelemetry-exporter-otlp-proto-grpc = "^1.44.0"
opentelemetry-instrumentation-flask = "^0.65b0"
opentelemetry-instrumentation-psycopg = "^0.65b0"
opentelemetry-instrumentation-requests = "^0.65b0"

[build-system]
requires = ["poetry>=1.3.2"]
build-backend = "poetry.masonry.api"
